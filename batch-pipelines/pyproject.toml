[project]
name = "semantic-lens-lite"
version = "0.1.0"
description = "Pipeline and API for the Semantic Lens Lite demo."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "psycopg[binary]",
    "pgvector",
    "requests",
    "crawl4ai",
    "html2text",
    "pydantic",
    "numpy",
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api", "prompts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
